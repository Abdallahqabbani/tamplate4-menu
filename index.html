<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="The Menu - Good food. No distractions.">

    <title>The Menu</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Hero -->
<main>
    <section class="hero">

        <img class="hero-image" src="images/burger1.webp" alt="Featured dish">

        <div class="hero-overlay"></div>

        <div class="hero-content">

            <p class="hero-label">
                WELCOME TO
            </p>

            <h1>
                THE<br>
                MENU
            </h1>

            <p class="hero-description">
                Good food. Simple choices.
            </p>

            <a href="#menu" class="hero-button">
                EXPLORE MENU
                <span>↓</span>
            </a>

        </div>

    </section>
</main>

        <!-- Menu -->
        <section class="menu-section" id="menu">

            <div class="section-heading">

                <p class="eyebrow">
                    OUR SELECTION
                </p>

                <h2>
                    THE MENU
                </h2>

            </div>


            <!-- Category Navigation -->
            <nav class="category-nav" aria-label="Menu categories">

                <button class="category-button active" data-category="all">
                    All
                </button>

                <button class="category-button" data-category="burgers">
                    Burgers
                </button>

                <button class="category-button" data-category="pizza">
                    Pizza
                </button>

                <button class="category-button" data-category="chicken">
                    Chicken
                </button>

                <button class="category-button" data-category="sides">
                    Sides
                </button>

                <button class="category-button" data-category="drinks">
                    Drinks
                </button>

                <button class="category-button" data-category="desserts">
                    Desserts
                </button>

            </nav>


            <!-- Menu Items -->
            <div class="menu-list" id="menuList">
                <!-- JavaScript will generate menu items -->
            </div>

        </section>


        <!-- Visit Us -->
        <section class="visit-section">

            <div class="visit-content">

                <p class="eyebrow">
                    COME BY
                </p>

                <h2>
                    VISIT US
                </h2>

                <div class="visit-grid">

                    <div class="visit-item">

                        <span class="visit-label">
                            LOCATION
                        </span>

                        <p>
                            Downtown<br>
                            Amman, Jordan
                        </p>

                    </div>


                    <div class="visit-item">

                        <span class="visit-label">
                            HOURS
                        </span>

                        <p>
                            MON — SUN<br>
                            11:00 AM — 12:00 AM
                        </p>

                    </div>


                    <div class="visit-item">

                        <span class="visit-label">
                            FOLLOW
                        </span>

                        <p>
                            <a href="https://www.instagram.com/abdullahqabani/" target="_blank">
                                Instagram
                            </a>
                            <br>

                            <a href="https://wa.me/962796333965" class="whatsapp-link" target="_blank">   WhatsApp</a>
                        </p>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <p>
            abdallahqabbani@
        </p>

        <div class="footer-links">

            <a href="#menu">
                Menu
            </a>

            <a href="https://www.instagram.com/abdullahqabani/">
                Instagram
            </a>

            <a href="https://www.google.com/maps/dir/%D8%B9%D9%85%D9%91%D8%A7%D9%86%E2%80%AD/%D8%AC%D8%A8%D9%84+%D8%A7%D9%84%D8%AA%D8%A7%D8%AC%D8%8C+%D8%B9%D9%85%D9%91%D8%A7%D9%86%E2%80%AD/@31.9623167,35.9647744,13z/data=!3m1!4b1!4m14!4m13!1m5!1m1!1s0x151b5fb85d7981af:0x631c30c0f8dc65e8!2m2!1d35.9105776!2d31.9543786!1m5!1m1!1s0x151b5fb1a81f7da5:0xaa895ee379c7f4f7!2m2!1d35.9502445!2d31.9493508!3e0?entry=ttu&g_ep=EgoyMDI2MDkxNi4wIKXMDSoASAFQAw%3D%3D">
                Location
            </a>

        </div>

    </footer>


    <script src="script.js"></script>

</body>

</html>
